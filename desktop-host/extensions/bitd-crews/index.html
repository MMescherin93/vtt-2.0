<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Клинки во тьме — бланки команд</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <b>Клинки во тьме</b>
      <span>бланки команд</span>
    </div>
    <label class="picker">
      Команда
      <select id="sheetSelect" aria-label="Выбор бланка команды"></select>
    </label>
    <div class="pager" aria-label="Страницы PDF">
      <button type="button" id="prevPage" title="Предыдущая страница">‹</button>
      <span id="pageLabel">1 / 1</span>
      <button type="button" id="nextPage" title="Следующая страница">›</button>
    </div>
    <div class="zoom" aria-label="Масштаб PDF">
      <button type="button" id="zoomOut" title="Уменьшить">−</button>
      <button type="button" id="fitWidth" title="По ширине">По ширине</button>
      <button type="button" id="zoomIn" title="Увеличить">+</button><span id="zoomLabel"></span>
    </div>
    <span id="status" class="status">PDF</span>
  </header>
  <main class="viewer" id="viewer">
    <canvas id="pdfCanvas"></canvas>
    <p id="error" class="error hidden"></p>
  </main>
  <script type="module" src="app.js"></script>
</body>
</html>
