<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Агон — лист героя</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <div class="brand"><b>Агон</b><span>лист героя</span></div>
    <div class="hint">Заполняйте прямо на листе</div>
    <button type="button" id="reset" class="reset">Сбросить поля</button>

  <main class="sheetWrap">
    <div class="sheet" id="sheet">
      <img src="sheet.png" alt="Лист персонажа «Агон»" draggable="false">
      <div class="fieldLayer" id="fieldLayer"></div>
    </div>
  </main>
  <script type="module" src="app.js"></script>
</body>
</html>
